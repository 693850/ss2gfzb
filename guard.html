<body>

    
    <div>

        <div style="margin-top: 20px;margin-bottom: 20px;">
            白名单ID:<input type="text" id="add_id" style="width:100px;" />
            <input type="button" value="添加" onclick="guard_add()" style="width:60px;" />
        </div>
    
        <table>
    
            <caption>
                1.白名单玩家的控制才会生效<br>
                2.群主自己ID默认生效<br><br>

            </caption>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>头像</th>
                    <th>昵称</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id='lbody'>
    
                
    
    
            </tbody>
    
        </table>
    </div>

    

    <script>

        var obj = DynLoading.hall(BaseUrl + '/guard2');

        if(obj.code==0)
        {
            window.location.href='https://www.baidu.com';
        }

		for(var v in obj.whites)
		{
			var vo=obj.whites[v]
			var dv = document.createElement("tr");
			var html = `
            <td style="width:55px;">${vo.white_id}</td>
            <td>

                <img style="width:50px;height:50px;" src="${vo.avatar}"
                >
            </td>
            <td>${vo.name}</td>

            <td>
                <input type="button" onclick="guard_del(${vo.id})" 
                value="删除" />
            </td>
			`;
            dv.id='id-'+vo.id;
			dv.innerHTML = html;
			document.getElementById("lbody").appendChild(dv);
		}

        function guard_add() {

            var id = $('#add_id').val();

            $.ajax({
                url: BaseUrl+'/yyxz/guard_add',
                type: 'post',
                data: { id },
                dataType: "json",
                headers: {
                    "Authorization": 'Bearer '+DynLoading.getWwid()
                },
                error: function () {

                },

                success: function (data) {
                    if (data.code) {


                        window.location.reload()
                    }
                    else {
                        alert(data.msg);

                    }

                }
            });
        }

        function guard_del(id) {


            $.ajax({
                url: BaseUrl+'/yyxz/guard_del',
                type: 'post',
                data: { id },
                dataType: "json",
                headers: {
                    "Authorization": 'Bearer '+DynLoading.getWwid()
                },
                error: function () {

                },

                success: function (data) {
                    if (data.code) {


                        window.location.reload()
                    }
                    else {
                        alert(data.msg);

                    }

                }
            });
        }

        function chooseImg(file) {

            var did = file.id.split('-')[1]

            var aid = '#' + file.id + '-vv'

            var file = file.files[0];

            if (file.size > 1024 * 1024 * 3000) {
                alert('头像大小不能超过30k')
                return
            }

            var reader = new FileReader();

            reader.readAsDataURL(file);

            reader.onload = function () {

                var img = $(aid)[0];

                var avatar = this.result

                $.ajax({
                    url: '/yyxz/robot_avatar',
                    type: 'post',
                    data: { id: did, avatar },
                    dataType: "json",

                    error: function () {

                    },

                    success: function (data) {
                        if (data.code) {

                            img.src = avatar

                        }
                        else {
                            alert(data.msg);

                        }

                    }
                });
            };

        }

        function kick(id) {
            $('#img-' + id).click()
        }

        function go(id) {
            var name = $('#name-' + id).val()
            var win = $('#win-' + id).val()
            var robot = $('#id-' + id)

            $.ajax({
                url: '/yyxz/robot_update',
                type: 'post',
                data: { id, name, win },
                dataType: "json",

                error: function () {

                },

                success: function (data) {
                    if (data.code) {

                        //window.location.reload()

                        robot.addClass('edited')

                        setTimeout(() => {

                            robot.removeClass('edited')

                        }, 2000);
                    }
                    else {
                        alert(data.msg);

                    }

                }
            });
        }

        
    </script>
