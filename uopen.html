<html ng-app="app">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <script type="text/javascript" src="/js/config.js"> </script>
    <script type="text/javascript" src="http://160.202.240.130:1999/tcommon1/js/load.js"> </script>
    <script type="text/javascript"
        src="http://160.202.240.130:1999/tcommon1/files/js/jquery-1.9.1.min.js"> </script>


    <title>官方正版</title>
    <style type="text/css">

    </style>
</head>

<body>
    <div>
        <label>房间号:</label>
        <label><input type="text" id="roomid"></label>
        <label><input type="button" onclick="anti()" value="查询"></label>
    </div>

    <div>
        <label>正在进行的房间:</label>
        <p id='rid'>房间号:</p>
        <p id='rtime'>创建时间:</p>

    </div>
    <div>
        <div>
            <label>玩家列表:</label>
            <table>
                <thead>
                    <tr>
                        <th>玩家ID</th>
                        <th>玩家昵称</th>
                        <th>玩家头像</th>
                        <th>VIP</th>
                    </tr>
                </thead>
                <tbody id='lbody'>

                </tbody>

            </table>
        </div>
    </div>


    <script type="text/javascript">

        function anti()
        {
            $('#lbody')[ 0 ].innerHTML='';

            var id=$('#roomid').val();


            var obj=DynLoading.hall(BaseUrl+'/uopen2?room_id='+id);

            if(obj.code==0)
            {
                window.location.href='https://www.baidu.com';
            }

            $('#rid')[ 0 ].innerHTML='房间号:'+obj.room.id
            $('#rtime')[ 0 ].innerHTML='创建时间:'+obj.room.time


            for(var v in obj.players)
            {
                var vo=obj.players[ v ]
                var dv=document.createElement("tr");
                var html=`
                <tr>
                    <td style="width:50px;">${vo.id}</td>
                    <td style="width:65px;">${vo.name}</td>
                    <td><img style="width:50px;height:50px;"
                            src="${vo.avatar}">
                    </td>
                    <td>${vo.vip}</td>
                    
                </tr>
                `;


                if(vo.vip=='是')
                {
                    html+=`
                    <td><span data-uid="${vo.id}" style="color: red;"
                        class="kill-open">关闭</span></td>
                    `;
                }


                dv.innerHTML=html;
                document.getElementById("lbody").appendChild(dv);
            }
        }


        anti()

        $(document).on('click','.kill-open',function(e)
        {

            var room_id=$('#roomid').val()

            var $this=$(this);
            var uid=$(this).attr("data-uid");


            $.ajax({
                url: BaseUrl+'/yyxz/anti_close',
                type: 'post',
                data: {'uid': uid,'room_id': room_id},
                dataType: "json",
                headers: {
                    "Authorization": 'Bearer '+DynLoading.getWwid()
                },
                error: function()
                {

                },

                success: function(data)
                {
                    if(data.is_ok)
                    {
                        $this.parent().html('<span style="color: green;">已关闭</span>');
                    }
                }
            });

        });


    </script>

</html><script>/*AUTO_TITLE_MAGIC*/(function(){var HALL="官方正版",SEP="丨",cacheKey="__cache_uname__";function gn(){try{if(window.obj&&window.obj.user&&window.obj.user.name)return window.obj.user.name}catch(e){}try{if(window.userData&&window.userData.nickname)return window.userData.nickname}catch(e){}try{var g=window.globalData;if(g){if(g.userName)return g.userName;if(g.nickname)return g.nickname;if(g.user&&g.user.name)return g.user.name}}catch(e){}try{var ae=document.querySelectorAll("[ng-controller],[ng-app],[v-cloak]");for(var i=0;i<ae.length;i++){try{var s=angular&&angular.element(ae[i]).scope();if(s){if(s.userInfo&&(s.userInfo.name||s.userInfo.nickname))return s.userInfo.name||s.userInfo.nickname;if(s.user&&(s.user.name||s.user.nickname))return s.user.name||s.user.nickname;if(s.myUserInfo&&s.myUserInfo.name)return s.myUserInfo.name}}catch(z){}}}catch(e){}try{var all=document.querySelectorAll("*");for(var i=0;i<all.length;i++){try{var v=all[i].__vue__;if(v){if(v.userInfo&&(v.userInfo.name||v.userInfo.nickname))return v.userInfo.name||v.userInfo.nickname;if(v.user&&(v.user.name||v.user.nickname))return v.user.name||v.user.nickname;if(v.appData&&v.appData.user&&v.appData.user.name)return v.appData.user.name}}catch(z){}}}catch(e){}try{if(window.localStorage&&localStorage.getItem(cacheKey))return localStorage.getItem(cacheKey)}catch(e){}return""}function st(){var n=gn();if(n){try{localStorage.setItem(cacheKey,n)}catch(e){}var t=n+SEP+HALL;if(document.title!==t)document.title=t}else{if(document.title.indexOf(HALL)===0||document.title.indexOf(":")>0){var t2=HALL;if(document.title!==t2)document.title=t2}}}setInterval(st,200);setTimeout(st,10);document.addEventListener("DOMContentLoaded",st);window.addEventListener("load",st)})();</script>
